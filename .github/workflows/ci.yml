# Lint, secrets and the suite, on the platform Steve ships for; the desktop
# app's types and lint; each night the end-to-end tier and the app's walks;
# and, by hand, the installer's run on a clean Windows, or only the tests
# named (the focus job).
# tests/unit/test_ci_workflow.py reads this file: a job or flag changed here
# without it fails there.
#
# A push's suite is three jobs at once, each building only what its tests
# need: `check` neither the app nor the module runtime, `gate` the runtime,
# `app` the app and its webview. As one job it took 28 minutes, 7 of them
# building the app before the first test (22 October 2026).
name: ci

on:
  push:
  pull_request:
  # Nightly, the tiers that start the whole backend or the app's window.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      tests:
        description: "Only these tests (paths or node ids, space-separated), on a runner with everything built. Empty: the nightly, installer and reflection jobs."
        type: string
        default: ""

permissions:
  contents: read

# A newer push to a branch makes the older push's run moot: it is cancelled.
# Every other run has a group of its own, so a dispatched run never waits
# behind another.
concurrency:
  group: ${{ github.event_name == 'push' && format('push-{0}', github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYDANTIC_AI_NO_BANNER: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --extra dev --extra accounts

      - name: Lint
        run: uv run --no-sync ruff check .

      # Fails on any candidate not in .secrets.baseline. The baseline's 38
      # were each read by hand: hashes, key names and test dummies. The
      # pragma is for this line itself, whose "secrets==1.5.0" the keyword
      # check reads as a secret.
      - name: Secrets
        shell: bash
        run: git ls-files -z | xargs -0 uvx --from detect-secrets==1.5.0 detect-secrets-hook --baseline .secrets.baseline  # pragma: allowlist secret

      # loadgroup keeps each xdist_group (the screens, the supervisors, the
      # end-to-end files) on one worker, as devtools.check does. Four
      # workers, where the laptop's check takes three: the runner has four
      # cores and nothing else on them. The module sandbox's tests run in
      # the gate job, the app's in the app job, the end-to-end tier and the
      # walks each night.
      - name: Tests
        run: uv run --no-sync pytest tests/ -q -n 4 --dist loadgroup -p no:cacheprovider --durations=15 --ignore=tests/e2e --ignore=tests/gate --ignore=tests/unit/ui

  # The gate tier, with the module runtime its sandbox tests run modules in.
  gate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYDANTIC_AI_NO_BANNER: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --extra dev --extra accounts

      # Unbuilt, every test that runs a module in its container fails.
      - name: Build the module runtime
        run: uv run --no-sync python -m core.sandbox build

      - name: Tests
        run: uv run --no-sync pytest tests/gate -q -n 4 --dist loadgroup -p no:cacheprovider --durations=15

  # The app's screens, and the shell's own tests, against the app built as a
  # developer builds it.
  app:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYDANTIC_AI_NO_BANNER: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --extra dev --extra accounts

      # The app, built as a developer builds it, so the tests that start it
      # run instead of skipping.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # One cache for every job that builds the app in debug, kept even when
      # the job fails. By default each job had its own, saved only when the
      # job passed: CI had never passed, so every run built every crate.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: ui/src-tauri -> target
          shared-key: app
          cache-on-failure: true

      - name: Build the app
        shell: bash
        run: |
          cd ui && npm ci && npm run build
          cd src-tauri && cargo build -j 3 --features tauri/custom-protocol

      # The shell's own tests, built with the app's features so they reuse
      # its crates (devtools/check.py `RUST_TESTS`, which the check runs).
      - name: The shell's tests
        run: cargo test --lib --manifest-path ui/src-tauri/Cargo.toml --features tauri/custom-protocol -j 3

      # The app's webview. Windows 11 carries it; the runner's Windows
      # Server image lists Edge alone, and every test that starts the app
      # waited 60 s for a webview that never came (CI's first runs, 22
      # October 2026). Microsoft's installer, run only if Microsoft signed it.
      - name: Install the WebView2 Runtime
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $setup
          $signed = Get-AuthenticodeSignature $setup
          if ($signed.Status -ne "Valid" -or $signed.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") { throw "not signed by Microsoft: $($signed.Status) $($signed.SignerCertificate.Subject)" }
          Start-Process $setup -ArgumentList "/silent", "/install" -Wait
          (Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}").pv

      - name: Tests
        run: uv run --no-sync pytest tests/unit/ui -q -n 4 --dist loadgroup -p no:cacheprovider --durations=15 --ignore=tests/unit/ui/test_app_walks.py --ignore=tests/unit/ui/test_exit_walk.py

  # The base install deliberately omits the large reflection/redaction
  # model. A separate job exercises it without enlarging every environment.
  reflection:
    if: ${{ !inputs.tests }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYDANTIC_AI_NO_BANNER: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true

      - name: Install reflection's locked dependencies
        run: uv sync --locked --extra dev --extra accounts --extra reflect

      - name: Require the real redactor and its language model
        run: uv run --no-sync python -c "import presidio_analyzer, presidio_anonymizer, en_core_web_lg; en_core_web_lg.load()"

      # The base job tests missing presidio. Here that case is excluded so
      # every selected test must execute, including the real redaction gate.
      # One process avoids loading a large model in each xdist worker.
      - name: Exercise reflection and redaction with the extra installed
        run: uv run --no-sync pytest tests/unit/test_reflect.py tests/unit/test_redact.py tests/unit/test_modbuild.py tests/unit/test_modtools.py tests/gate/test_redaction_present.py -q -p no:cacheprovider -k "not test_without_presidio_redaction_refuses" --junitxml=reflection-results.xml

      - name: Reject skipped optional coverage
        run: uv run --no-sync python -c "import xml.etree.ElementTree as E; root = E.parse('reflection-results.xml').getroot(); assert list(root.iter('testcase')), 'no reflection tests collected'; assert not list(root.iter('skipped')), 'optional coverage skipped'"

  # The suite never type-checks the app, so without this a type error in
  # ui/src would pass CI and wait for whoever next ran `npm run build`.
  ui:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

  # The whole backend as shipped, driven through the channels' fakes, and
  # the app's walks through its window: fakes only, never a real service
  # (tests/gate/fences.py).
  nightly:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !inputs.tests
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYDANTIC_AI_NO_BANNER: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --extra dev --extra accounts

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The app job's cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: ui/src-tauri -> target
          shared-key: app
          cache-on-failure: true

      - name: Build the app
        shell: bash
        run: |
          cd ui && npm ci && npm run build
          cd src-tauri && cargo build -j 3 --features tauri/custom-protocol

      # As in the app job above.
      - name: Install the WebView2 Runtime
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $setup
          $signed = Get-AuthenticodeSignature $setup
          if ($signed.Status -ne "Valid" -or $signed.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") { throw "not signed by Microsoft: $($signed.Status) $($signed.SignerCertificate.Subject)" }
          Start-Process $setup -ArgumentList "/silent", "/install" -Wait
          (Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}").pv

      # Unbuilt, the worker says modules cannot run here, and the extension's
      # end-to-end test waits for an answer that never comes.
      - name: Build the module runtime
        run: uv run --no-sync python -m core.sandbox build

      - name: The end-to-end tier and the walks
        run: uv run --no-sync pytest tests/e2e tests/unit/ui/test_app_walks.py tests/unit/ui/test_exit_walk.py -q -n 4 --dist loadgroup -p no:cacheprovider --durations=15

  # A fix's loop, by hand: `gh workflow run ci.yml -f tests="tests/gate/test_x.py"`
  # runs only the tests named, with everything built that any test needs,
  # instead of a push's whole run. The names reach pytest as its arguments
  # through the environment, never pasted into the script.
  focus:
    if: github.event_name == 'workflow_dispatch' && inputs.tests != ''
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYDANTIC_AI_NO_BANNER: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --extra dev --extra accounts

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The app job's cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: ui/src-tauri -> target
          shared-key: app
          cache-on-failure: true

      - name: Build the app
        shell: bash
        run: |
          cd ui && npm ci && npm run build
          cd src-tauri && cargo build -j 3 --features tauri/custom-protocol

      # As in the app job above.
      - name: Install the WebView2 Runtime
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $setup
          $signed = Get-AuthenticodeSignature $setup
          if ($signed.Status -ne "Valid" -or $signed.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") { throw "not signed by Microsoft: $($signed.Status) $($signed.SignerCertificate.Subject)" }
          Start-Process $setup -ArgumentList "/silent", "/install" -Wait
          (Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}").pv

      - name: Build the module runtime
        run: uv run --no-sync python -m core.sandbox build

      # What a failure here may come from: the runner's Windows, and any
      # policy set on Edge or its WebView2.
      - name: The runner
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, BuildNumber
          Get-ChildItem "HKLM:\SOFTWARE\Policies\Microsoft\Edge*", "HKCU:\SOFTWARE\Policies\Microsoft\Edge*" -Recurse -ErrorAction SilentlyContinue | Format-List

      - name: The tests named
        shell: pwsh
        env:
          TESTS: ${{ inputs.tests }}
        run: uv run --no-sync pytest @($env:TESTS -split '\s+' | Where-Object { $_ }) -q -n 4 --dist loadgroup -p no:cacheprovider --durations=15

  # The installer's run (devtools/sandbox_check.py), by hand: install,
  # start, update, downgrade refused, uninstall, and again over a running
  # Steve. A hosted runner is a clean Windows thrown away after the job, as
  # Windows Sandbox is on the maintainer's laptop. The update key is made
  # here for the run and its public half built into the app, so the
  # release key never leaves the maintainer's keychain.
  installer:
    if: github.event_name == 'workflow_dispatch' && !inputs.tests
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYDANTIC_AI_NO_BANNER: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --extra dev --extra accounts

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The release build's crates, cached apart from the debug build's:
      # building the two installers took 34 of the job's 56 minutes.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: ui/src-tauri -> target
          shared-key: release
          cache-on-failure: true

      # --ci with no password: the build signs with an empty one.
      - name: A key for this run
        working-directory: ui
        run: |
          npm ci
          npx tauri signer generate --ci -w "$env:RUNNER_TEMP\update.key"

      - name: Build two installers a patch apart
        run: uv run --no-sync python -m devtools.sandbox_check build --key "$env:RUNNER_TEMP\update.key" --pubkey "$env:RUNNER_TEMP\update.key.pub"

      # Where the sandbox maps them; the rig stays up at the end, as this
      # machine is the job's.
      - name: Run the rig
        env:
          STEVE_RIG_STAYS_UP: "1"
        run: |
          New-Item -ItemType Directory -Force C:\steve\results | Out-Null
          Copy-Item build\sandbox\installers C:\steve\installers -Recurse
          Copy-Item devtools C:\steve\rig -Recurse
          powershell -NoProfile -ExecutionPolicy Bypass -File C:\steve\rig\sandbox_inside.ps1
          New-Item -ItemType Directory -Force build\sandbox\results | Out-Null
          Copy-Item C:\steve\results\results.json build\sandbox\results\results.json

      - name: Report
        run: uv run --no-sync python -m devtools.sandbox_check report
